<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QWERST.COM</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0d0d0f;color:#fff;font-family:'DM Sans',sans-serif;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  overflow:hidden;}
.bg{position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse at 20% 50%,rgba(255,107,0,.12) 0%,transparent 50%),
             radial-gradient(ellipse at 80% 20%,rgba(232,255,71,.06) 0%,transparent 50%),
             #0d0d0f;}
.grid-lines{position:fixed;inset:0;z-index:0;opacity:.04;
  background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);
  background-size:60px 60px;}
.content{position:relative;z-index:1;text-align:center;padding:20px;}
.logo{font-family:'Bebas Neue',cursive;font-size:clamp(72px,15vw,160px);
  letter-spacing:-2px;line-height:.9;margin-bottom:16px;
  background:linear-gradient(135deg,#ff6b00 0%,#ffb347 50%,#ff6b00 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 40px rgba(255,107,0,.4));}
.tagline{font-size:14px;color:#666;letter-spacing:4px;text-transform:uppercase;
  margin-bottom:64px;font-weight:400;}
.cards{display:flex;gap:24px;justify-content:center;flex-wrap:wrap;}
.card{position:relative;width:240px;height:300px;border-radius:20px;overflow:hidden;
  cursor:pointer;transition:all .3s;text-decoration:none;display:block;
  border:1px solid rgba(255,255,255,.06);}
.card:hover{transform:translateY(-8px) scale(1.02);box-shadow:0 32px 64px rgba(0,0,0,.5);}
.card-bg{position:absolute;inset:0;background-size:cover;background-position:center;
  transition:transform .4s;}
.card:hover .card-bg{transform:scale(1.05);}
.card-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.9) 0%,rgba(0,0,0,.3) 60%,transparent 100%);}
.card-content{position:absolute;bottom:0;left:0;right:0;padding:24px;}
.card-icon{font-size:36px;margin-bottom:8px;display:block;}
.card-title{font-family:'Bebas Neue',cursive;font-size:32px;letter-spacing:1px;margin-bottom:4px;}
.card-sub{font-size:12px;color:rgba(255,255,255,.5);letter-spacing:1px;text-transform:uppercase;}
.card-arrow{position:absolute;top:20px;right:20px;width:32px;height:32px;
  background:rgba(255,255,255,.1);border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:14px;transition:all .3s;backdrop-filter:blur(4px);}
.card:hover .card-arrow{background:rgba(255,107,0,.6);transform:rotate(45deg);}
.card-game .card-bg{background-image:url('https://images.igdb.com/igdb/image/upload/t_screenshot_big/sc9etx.jpg');}
.card-game{border-color:rgba(232,255,71,.1);}
.card-game:hover{box-shadow:0 32px 64px rgba(232,255,71,.15);}
.card-game .card-title{color:#e8ff47;}
.card-book .card-bg{background-image:url('https://images.unsplash.com/photo-1481627834876-b7833e8f5570?w=400&q=80');}
.card-book{border-color:rgba(255,107,0,.1);}
.card-book:hover{box-shadow:0 32px 64px rgba(255,107,0,.15);}
.card-book .card-title{color:#ff6b00;}
.footer{position:relative;z-index:1;margin-top:48px;font-size:12px;color:#333;
  letter-spacing:2px;text-transform:uppercase;}
@keyframes fadeIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.logo{animation:fadeIn .6s ease both;}
.tagline{animation:fadeIn .6s .15s ease both;opacity:0;}
.cards{animation:fadeIn .6s .3s ease both;opacity:0;}
</style>
</head>
<body>
<div class="bg"></div>
<div class="grid-lines"></div>
<div class="content">
  <div class="logo">QWERST</div>
  <div class="tagline">.COM · Takip Et · Keşfet · Paylaş</div>
  <div class="cards">
    <a href="index.html" class="card card-game">
      <div class="card-bg"></div>
      <div class="card-overlay"></div>
      <div class="card-arrow">↗</div>
      <div class="card-content">
        <span class="card-icon">🎮</span>
        <div class="card-title">OYUNLAR</div>
        <div class="card-sub">qwerst.com</div>
      </div>
    </a>
    <a href="kitap/index.html" class="card card-book">
      <div class="card-bg"></div>
      <div class="card-overlay"></div>
      <div class="card-arrow">↗</div>
      <div class="card-content">
        <span class="card-icon">📚</span>
        <div class="card-title">KİTAPLAR</div>
        <div class="card-sub">qwerst.com/kitap</div>
      </div>
    </a>
  </div>
</div>
<div class="footer">© 2025 QWERST.COM · İslam & Şahin</div>
</body>
</html>
