<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QWERST.COM</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d0f;--surface:#16161a;--surface2:#1e1e24;--border:#2a2a32;--accent:#e8ff47;--text:#f0f0f5;--muted:#666677;--radius:10px;}
:root.light{--bg:#f0f0eb;--surface:#ffffff;--surface2:#e8e8e0;--border:#d0d0c8;--accent:#b8a000;--text:#1a1a1a;--muted:#777770;}
body,div,header,main,input,button,select,textarea{transition:background-color .25s,border-color .25s;}
.theme-btn{background:none;border:1px solid var(--border);border-radius:20px;color:var(--muted);font-size:15px;cursor:pointer;padding:4px 10px;line-height:1;}
.theme-btn:hover{color:var(--accent);border-color:var(--accent);}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden;}
.hidden{display:none !important;}

/* PUBLIC SCREEN STYLES */
#publicScreen{padding:20px;max-width:1200px;margin:0 auto;}
.pub-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:40px;padding:10px 0;}
.pub-logo{font-family:'Bebas Neue',cursive;font-size:32px;letter-spacing:2px;color:var(--accent);text-decoration:none;}
.pub-nav{display:flex;gap:15px;align-items:center;}
.btn-login{background:var(--accent);color:#000;border:none;padding:8px 20px;border-radius:20px;font-weight:600;cursor:pointer;font-size:14px;}
.section-title{font-family:'Bebas Neue',cursive;font-size:28px;margin-bottom:20px;letter-spacing:1px;display:flex;align-items:center;gap:10px;}
#most-played-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px;}

/* AUTH SCREEN */
#authScreen{display:none;position:fixed;inset:0;background:var(--bg);z-index:1000;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
.auth-card{background:var(--surface);border:1px solid var(--border);padding:32px;border-radius:20px;width:100%;max-width:400px;}
.auth-tabs{display:flex;gap:20px;margin-bottom:24px;border-bottom:1px solid var(--border);}
.auth-tab{padding:8px 0;color:var(--muted);cursor:pointer;font-weight:600;position:relative;}
.auth-tab.active{color:var(--accent);}
.auth-tab.active::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:var(--accent);}
.auth-form{display:flex;flex-direction:column;gap:15px;}
.auth-form input{background:var(--surface2);border:1px solid var(--border);padding:12px;border-radius:var(--radius);color:#fff;outline:none;}
.auth-form button{background:var(--accent);color:#000;border:none;padding:12px;border-radius:var(--radius);font-weight:700;cursor:pointer;margin-top:10px;}
.auth-back{margin-top:20px;color:var(--muted);cursor:pointer;font-size:14px;}

/* APP SCREEN (LOGGED IN) */
#appScreen{display:none;}
header.site-header{height:64px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 20px;}
.nav-links{display:flex;gap:25px;}
.nav-link{color:var(--muted);text-decoration:none;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px;}
.nav-link.active{color:var(--accent);}
.user-area{display:flex;align-items:center;gap:15px;}

/* GAME CARDS */
.game-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:transform .2s, border-color .2s;position:relative;}
.game-card:hover{transform:translateY(-4px);border-color:var(--accent);}
.game-img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#222;}
.game-info{padding:12px;}
.game-name{font-weight:600;font-size:14px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.game-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);}

/* RESPONSIVE */
@media (max-width:600px){
  #most-played-list{grid-template-columns:1fr 1fr;}
  .pub-logo{font-size:24px;}
  .nav-text{display:none;}
}
</style>
</head>
<body>

<div id="publicScreen">
  <header class="pub-header">
    <a href="index.html" class="pub-logo">QWERST</a>
    <div class="pub-nav">
      <button class="theme-btn" id="themeTogglePub" onclick="_toggleTheme()">🌙</button>
      <button class="btn-login" onclick="showAuthScreen()">GİRİŞ YAP</button>
    </div>
  </header>

  <main>
    <h2 class="section-title"><span>🔥</span> HALKIN SEÇİMİ</h2>
    <div id="most-played-list">
      <div style="grid-column:1/-1; text-align:center; padding:50px; color:var(--muted)">Yükleniyor...</div>
    </div>
  </main>
</div>

<div id="authScreen">
  <div class="auth-card">
    <div class="auth-tabs">
      <div id="tabLogin" class="auth-tab active" onclick="setAuthMode('login')">Giriş Yap</div>
      <div id="tabRegister" class="auth-tab" onclick="setAuthMode('register')">Kayıt Ol</div>
    </div>
    <div class="auth-form">
      <input type="text" id="authUsername" placeholder="Kullanıcı Adı" class="hidden">
      <input type="email" id="authEmail" placeholder="E-posta">
      <input type="password" id="authPass" placeholder="Şifre">
      <button id="authBtn" onclick="handleAuth()">Giriş Yap</button>
    </div>
    <div class="auth-back" onclick="location.reload()">← Geri Dön</div>
  </div>
</div>

<div id="appScreen">
  <header class="site-header">
    <div class="nav-links">
      <div class="nav-link active" onclick="showTab('search')"><span>🔍</span> <span class="nav-text" id="tabSearch">Ara</span></div>
      <div class="nav-link" onclick="showTab('mylist')"><span>📋</span> <span class="nav-text" id="tabMylist">Listelerim</span></div>
      <div class="nav-link" onclick="showTab('friends')"><span>👥</span> <span class="nav-text" id="tabFriends">Arkadaşlar</span></div>
    </div>
    <div class="user-area">
      <button class="theme-btn" id="themeToggleApp" onclick="_toggleTheme()">🌙</button>
      <button class="theme-btn" onclick="handleLogout()" id="logoutBtn">Çıkış</button>
    </div>
  </header>

  <main id="mainContent" style="padding:20px; max-width:1200px; margin:0 auto;">
    <div id="tab-search" class="tab-content">
       <div class="search-hero" style="text-align:center; padding:40px 0;">
         <h1 id="heroH1" style="font-family:'Bebas Neue'; font-size:48px; margin-bottom:10px;">OYUN BUL, LİSTEYE EKLE</h1>
         <div style="display:flex; gap:10px; max-width:600px; margin:20px auto;">
           <input type="text" id="searchInput" placeholder="Oyun adı ara..." style="flex:1; padding:12px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:#fff;">
           <button id="searchBtn" onclick="searchGames()" style="background:var(--accent); border:none; padding:0 25px; border-radius:10px; font-weight:700; cursor:pointer;">Ara</button>
         </div>
       </div>
       <div id="searchResults" style="display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:20px;"></div>
    </div>
    
    <div id="tab-mylist" class="tab-content hidden">
       <div id="myListsContainer"></div>
    </div>

    <div id="tab-friends" class="tab-content hidden">
       <div id="friendsContainer"></div>
    </div>
  </main>
</div>

<div id="toast" style="position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--accent); color:#000; padding:10px 20px; border-radius:20px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .3s; z-index:9999;"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="lang.js"></script>
<script src="public.js"></script>
<script src="app.js"></script>

<script data-cfasync="false">
// TEMA YÖNETİMİ
(function(){
  var root = document.documentElement;
  function applyTheme(t) {
    if (t === 'light') root.classList.add('light');
    else root.classList.remove('light');
    var icon = t === 'light' ? '☀️' : '🌙';
    ['themeTogglePub','themeToggleApp'].forEach(function(id){
      var el = document.getElementById(id);
      if (el) el.innerHTML = icon;
    });
    localStorage.setItem('qwerst-theme', t);
  }
  window._applyTheme = applyTheme;
  window._toggleTheme = function(){ applyTheme(root.classList.contains('light') ? 'dark' : 'light'); };
  applyTheme(localStorage.getItem('qwerst-theme') || 'dark');
})();

// SİSTEMİ BAŞLAT
async function bootSystem() {
  if (typeof initApp === "function" && typeof supabase !== "undefined") {
    try {
      // Supabase istemcisini app.js'den alıyoruz (sb global değişkeni)
      const { data: { session } } = await sb.auth.getSession();
      
      if (session && session.user) {
        // GİRİŞ VAR
        showApp(session.user);
      } else {
        // GİRİŞ YOK
        loadPublicGames();
      }
    } catch (e) {
      console.error("Boot Error:", e);
      loadPublicGames();
    }
  } else {
    setTimeout(bootSystem, 100);
  }
}

window.addEventListener('DOMContentLoaded', bootSystem);
</script>
</body>
</html>
